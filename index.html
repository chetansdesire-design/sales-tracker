<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Sales Tracker v3.9.3</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --success: #10b981; --danger: #f43f5e; --admin: #8b5cf6; --warn: #f59e0b; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e2e8f0, #e0e7ff, #f3e8ff); background-attachment: fixed; margin: 0; padding: 10px; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 1100px; margin: auto; display: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); border-radius: 15px; }
        #loginOverlay { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .stat-card { padding: 15px; text-align: center; }
        .stat-card h3 { font-size: 11px; color: #475569; margin: 0; text-transform: uppercase; }
        .stat-card p { font-size: 17px; font-weight: 800; margin: 5px 0 0; }
        .form-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .form-panel input, .form-panel select { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 8px; }
        .btn-add { background: var(--success); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .table-wrap { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 750px; }
        th { background: rgba(241, 245, 249, 0.6); padding: 12px; text-align: left; font-size: 11px; color: #475569; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid rgba(226, 232, 240, 0.6); font-size: 13px; }
        .autocomplete-wrapper { flex: 2; position: relative; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border-radius: 8px; max-height: 150px; overflow-y: auto; z-index: 1000; display: none; list-style: none; padding: 0; margin: 4px 0 0 0; }
        .autocomplete-list li { padding: 10px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .autocomplete-list li:hover { background: var(--accent); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .badge-bill { background: #e2e8f0; color: #475569; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>Team Sales Portal</h2>
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-login" onclick="handleLogin()">Sign In</button>
    </div>
</div>

<div class="container" id="mainApp">
    <header>
        <div><h2 id="welcomeName" style="margin:0;">Hi</h2><span id="roleBadge" class="badge badge-bill">Sales Team</span></div>
        <button onclick="toggleSettings()" style="cursor:pointer; border:none; background:none; font-size: 20px;">⚙️</button>
    </header>

    <div class="form-panel" id="inputPanel">
        <h4 style="margin: 0 0 15px 0; color:white;">📝 New Sale Entry</h4>
        <div style="display:flex; flex-direction:column; gap:15px;">
            <div id="adminSalesmanSelectContainer" style="display: none;">
                <label style="color:#cbd5e1; font-size:11px;">Log For:</label>
                <select id="entrySalesman" style="padding: 10px;"></select>
            </div>
            <div style="display:flex; gap:15px;">
                <div style="flex:1"><label style="color:#cbd5e1; font-size:11px;">Date</label><input type="date" id="date"></div>
                <div style="flex:1"><label style="color:#cbd5e1; font-size:11px;">Bill No.</label><input type="text" id="billNo" placeholder="INV-1023"></div>
            </div>
            <div><label style="color:#cbd5e1; font-size:11px;">Customer Name</label><input type="text" id="customer" placeholder="Client Name"></div>
            <div>
                <label style="color:#cbd5e1; font-size:11px;">Products</label>
                <div id="productEntries">
                    <div class="product-entry-row" style="display: flex; gap: 8px; margin-bottom: 10px;">
                        <div class="autocomplete-wrapper">
                            <input type="text" class="prod-name" placeholder="Search/Type..." autocomplete="off" style="padding: 10px;" oninput="filterDropdown(this)" onfocus="filterDropdown(this)" onblur="hideDropdown(this)">
                            <ul class="autocomplete-list"></ul>
                        </div>
                        <input type="number" class="prod-amount" placeholder="₹ Amt" style="flex: 1; padding: 10px;">
                        <button class="btn-action" style="padding: 0 12px; border-radius: 8px;" onclick="addProductRow(this)">➕</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn-add" onclick="addBillEntries()">Submit Full Bill</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card glass-panel"><h3>Target</h3><p id="targetValText">₹10L</p></div>
        <div class="stat-card glass-panel"><h3>Achieved</h3><p id="totalVal" style="color: var(--success);">₹0</p></div>
    </div>
    
    <div class="table-wrap glass-panel">
        <table id="salesTable">
            <thead><tr><th>Date</th><th>Bill</th><th>Product</th><th>Customer</th><th>Amount</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="version-tag">Version 3.9.3 | Fully Patched</div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCkciiLP3SIrK1yNNqhs1JtlCc_c55YOOY", authDomain: "sales-tracker-27660.app", databaseURL: "https://sales-tracker-27660-default-rtdb.firebaseio.com/", projectId: "sales-tracker-27660", appId: "1:960783153617:web:9b9fa521836b9f5ef488f0" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('activeUser');
    let availableProducts = [];
    let allSales = [];

    window.onload = () => { if(currentUser) showApp(); };

    function showApp() {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('welcomeName').innerText = `Hi, ${currentUser}`;
        document.getElementById('date').value = new Date().toISOString().slice(0,10);
        if(currentUser === 'admin') document.getElementById('adminSalesmanSelectContainer').style.display = 'block';
        
        db.ref('products').on('value', snap => {
            const data = snap.val() || {};
            availableProducts = Object.keys(data).map(k => ({ id: k, name: data[k].name }));
        });
        
        db.ref('sales').on('value', snap => {
            allSales = snap.val() ? Object.entries(snap.val()).map(([k, v]) => ({...v, fireId: k})) : [];
            runUpdateUI();
        });
    }

    async function handleLogin() {
        const u = document.getElementById('loginUser').value.toLowerCase().trim();
        const p = document.getElementById('loginPass').value;
        const snap = await db.ref(`userConfigs/${u}`).once('value');
        if(snap.val() && (snap.val().password === p || snap.val() === p)) {
            localStorage.setItem('activeUser', u);
            location.reload();
        } else alert("Invalid");
    }

    function filterDropdown(input) {
        const val = input.value.toLowerCase();
        const wrapper = input.parentElement;
        let list = wrapper.querySelector('.autocomplete-list');
        list.innerHTML = '';
        const matches = val ? availableProducts.filter(p => p.name.toLowerCase().includes(val)) : availableProducts;
        if(matches.length > 0) {
            matches.forEach(p => {
                const li = document.createElement('li');
                li.innerText = p.name;
                li.onmousedown = () => { input.value = p.name; list.style.display = 'none'; };
                list.appendChild(li);
            });
            list.style.display = 'block';
        } else list.style.display = 'none';
    }

    function hideDropdown(input) {
        setTimeout(() => { input.parentElement.querySelector('.autocomplete-list').style.display = 'none'; }, 200);
    }

    function addProductRow(btn) {
        btn.style.display = 'none';
        btn.outerHTML = `<button class="btn-danger" style="padding: 0 12px; border-radius: 8px;" onclick="this.parentElement.remove()">❌</button>`;
        const container = document.getElementById('productEntries');
        container.insertAdjacentHTML('beforeend', `
            <div class="product-entry-row" style="display: flex; gap: 8px; margin-bottom: 10px;">
                <div class="autocomplete-wrapper">
                    <input type="text" class="prod-name" placeholder="Search/Type..." autocomplete="off" style="padding: 10px; width: 100%; box-sizing: border-box;" oninput="filterDropdown(this)" onfocus="filterDropdown(this)" onblur="hideDropdown(this)">
                    <ul class="autocomplete-list"></ul>
                </div>
                <input type="number" class="prod-amount" placeholder="₹ Amt" style="flex: 1; padding: 10px; box-sizing: border-box;">
                <button class="btn-action" style="padding: 0 12px; border-radius: 8px;" onclick="addProductRow(this)">➕</button>
            </div>
        `);
    }

    function addBillEntries() {
        const date = document.getElementById('date').value;
        const bill = document.getElementById('billNo').value.trim();
        const customer = document.getElementById('customer').value.trim();
        if(!date || !bill || !customer) return alert("Fill required fields");

        const rows = document.querySelectorAll('.product-entry-row');
        let valid = [];
        rows.forEach(row => {
            const name = row.querySelector('.prod-name').value.trim();
            const amt = parseFloat(row.querySelector('.prod-amount').value);
            if(name && !isNaN(amt)) {
                const match = availableProducts.find(p => p.name.toLowerCase() === name.toLowerCase());
                valid.push({ name: match ? match.name : name, amount: amt });
            }
        });

        if(valid.length === 0) return alert("Add at least one product");

        valid.forEach(item => {
            db.ref('sales').push({ 
                salesman: currentUser, date, billNo: bill, customer, 
                product: item.name, amount: item.amount, status: 'Completed', timestamp: Date.now() 
            });
        });
        alert("Saved!"); location.reload();
    }

    function runUpdateUI() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let total = 0;
        [...allSales].reverse().forEach(item => {
            total += item.amount;
            tbody.innerHTML += `<tr><td>${item.date}</td><td>${item.billNo}</td><td>${item.product}</td><td>${item.customer}</td><td>₹${item.amount.toLocaleString()}</td></tr>`;
        });
        document.getElementById('totalVal').innerText = `₹${total.toLocaleString()}`;
    }

    function toggleSettings() { alert("Settings functionality goes here."); }
    function handleLogout() { localStorage.removeItem('activeUser'); location.reload(); }
</script>
</body>
</html>
