<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Sales Tracker v4.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary: #0f172a; --accent: #3b82f6; --success: #10b981; 
            --danger: #f43f5e; --admin: #8b5cf6; --warn: #f59e0b; 
        }
        
        /* 1. GLASSMORPHISM BACKGROUND & BASE */
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #e2e8f0, #e0e7ff, #f3e8ff); 
            background-attachment: fixed;
            margin: 0; padding: 10px; padding-bottom: 80px; 
            -webkit-tap-highlight-color: transparent; 
        }
        .container { max-width: 1100px; margin: auto; display: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border-radius: 15px;
        }

        #loginOverlay { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; }
        .login-card input, .settings-panel input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        
        .btn-login { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-login:hover { opacity: 0.9; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .stat-card { padding: 15px; text-align: center; }
        .stat-card h3 { font-size: 11px; color: #475569; margin: 0; text-transform: uppercase; }
        .stat-card p { font-size: 17px; font-weight: 800; margin: 5px 0 0; word-break: break-word; }
        
        .filter-section { margin-bottom: 15px; padding: 10px; display: flex; gap: 15px; flex-wrap: wrap; }
        .filter-box { flex: 1; min-width: 120px; }
        
        select, input[type="date"], input[type="text"], input[type="number"] { 
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; 
            font-size: 14px; font-weight: 600; color: var(--primary); background: rgba(255,255,255,0.9);
            box-sizing: border-box;
        }
        
        .progress-container { padding: 15px; margin-bottom: 20px; }
        .progress-bar-bg { width: 100%; background: rgba(226, 232, 240, 0.5); height: 10px; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.6s ease; }
        
        .chart-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 15px; }
        @media (min-width: 768px) { .chart-grid.admin-mode { grid-template-columns: 1fr 1fr; } .chart-grid.split { grid-template-columns: 1fr 1fr; } }
        .chart-box { padding: 15px; height: 260px; }
        
        /* 2. MOBILE-FIRST DARK GLASSMORPHISM FORM */
        .form-panel { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        .autocomplete-list li:hover { background: var(--accent); }
        
        .btn-add { background: var(--success); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: transform 0.1s; }
        .btn-add:active { transform: scale(0.98); }
        
        .btn-danger { background: var(--danger); color: white; border: none; cursor: pointer; border-radius: 8px;}
        .btn-action { background: var(--accent); color: white; border: none; cursor: pointer; border-radius: 8px;}
        .btn-view { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;}
        
        .table-wrap { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; background: transparent; }
        th { background: rgba(241, 245, 249, 0.6); padding: 12px; text-align: left; font-size: 11px; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 12px; border-bottom: 1px solid rgba(226, 232, 240, 0.6); font-size: 13px; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .badge-bill { background: #e2e8f0; color: #475569; }
        .badge-completed { background: #d1fae5; color: #065f46; }
        .badge-cancelled { background: #f3f4f6; color: #374151; }

        .settings-panel { display:none; padding: 20px; margin-bottom: 20px; }
        
        /* MODAL STYLES */
        #detailModalOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 15px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: var(--primary); font-size: 18px; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--danger); }
        .modal-summary { display: flex; justify-content: space-between; background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="margin:0 0 20px 0;">Team Sales Portal</h2>
        <input type="text" id="loginUser" placeholder="Username (Try 'admin' or 'user')">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-login" onclick="handleLogin()">Sign In</button>
    </div>
</div>

<div class="container" id="mainApp">
    
    <header>
        <div><h2 id="welcomeName" style="margin:0;">Hi</h2><span id="roleBadge" class="badge badge-bill">Sales Team</span></div>
        <div style="display:flex; gap:15px; align-items:center;">
            <button onclick="toggleSettings()" style="cursor:pointer; border:none; background:none; font-size: 20px;" title="Settings">⚙️</button>
            <button onclick="handleLogout()" style="cursor:pointer; border:none; background:none; color:var(--danger); font-weight:bold;">Logout</button>
        </div>
    </header>

    <div id="settingsPanel" class="settings-panel glass-panel">
        <h3 style="margin-top:0; font-size: 16px;">Account Settings</h3>
        <div style="position: relative; max-width: 320px;">
            <input type="password" id="newPass" placeholder="Enter New Password">
            <button class="btn-login" onclick="alert('Password Updated')" style="margin-top: 10px; padding: 10px;">Update Password</button>
        </div>
    </div>

    <!-- ENTRY FORM -->
    <div class="form-panel" id="inputPanel">
        <h4 style="margin: 0 0 15px 0;">📝 Enter Sale Details</h4>
        
        <div class="form-grid">
            <div class="form-grid-row">
                <div>
                    <label>Date</label>
                    <input type="date" id="date">
                </div>
                <div>
                    <label>Bill No.</label>
                    <input type="text" id="billNo" placeholder="INV-1023">
                </div>
            </div>

            <div>
                <label>Customer Name</label>
                <input type="text" id="customer" placeholder="Enter Client Name">
            </div>

            <div>
                <label>Products (List Format)</label>
                <div id="productEntries">
                    <div class="product-entry-row">
                        <div class="autocomplete-wrapper">
                            <input type="text" class="prod-name" placeholder="Search/Select Product..." autocomplete="off">
                        </div>
                        <input type="number" class="prod-qty" placeholder="Qty">
                        <input type="number" class="prod-amount" placeholder="₹ Amt">
                        <button class="btn-action" style="font-size: 16px;" onclick="addProductRow(this)">➕</button>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-add" onclick="addBillEntries()">Submit Full Bill</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card glass-panel"><h3>Target</h3><p id="targetValText">₹1,000,000</p></div>
        <div class="stat-card glass-panel"><h3><span id="statTitle">Achieved</span></h3><p id="totalVal" style="color: var(--success);">₹0</p></div>
        <div class="stat-card glass-panel"><h3>Gap</h3><p id="gapVal" style="color: var(--danger);">₹1,000,000</p></div>
    </div>

    <div class="progress-container glass-panel">
        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; color:#475569;">
            <span id="progLabel">Target Progress</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg"><div id="progressBar"></div></div>
    </div>


    <!-- ADMIN EXCLUSIVE REPORTS -->
    <div id="adminSection" style="display:none;">
        <!-- MAIN DATA TABLE -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; margin-bottom:10px;">
            <h3 style="font-size: 15px; margin:0;">🧾 Bills History</h3>
        </div>
        <div class="table-wrap glass-panel">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>User</th>
                        <th>Bill No</th>
                        <th>Customer</th>
                        <th>Total Qty</th>
                        <th>Total Amt</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic Sales Data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- DETAILS MODAL -->
    <div id="detailModalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Invoice Details: <span id="modalBillNo"></span></h3>
                <button class="modal-close" onclick="closeDetailsModal()">✖</button>
            </div>
            <div class="modal-summary">
                <div><strong>Customer:</strong> <span id="modalCustomer"></span></div>
                <div><strong>Date:</strong> <span id="modalDate"></span></div>
            </div>
            
            <div class="table-wrap" style="margin-bottom:0; max-height:250px;">
                <table style="min-width: 100%;">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Qty</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="modalDetailsBody">
                    </tbody>
                </table>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 20px; padding-top: 15px; border-top: 2px solid #e2e8f0; margin-top: 10px; font-weight: bold; color: var(--primary);">
                <span>Total Qty: <span id="modalTotalQty" style="color:var(--accent);"></span></span>
                <span>Total Amt: <span id="modalTotalAmt" style="color:var(--success);"></span></span>
            </div>
        </div>
    </div>

</div> 

<!-- SCRIPTS -->
<script>
    // System State
    let currentUser = '';
    const monthlyTarget = 1000000; // 10 Lakhs
    let billsData = []; // Store all submissions here

    // Set today's date automatically
    document.getElementById('date').valueAsDate = new Date();

    function handleLogin() {
        const user = document.getElementById('loginUser').value.trim();
        if (user) {
            currentUser = user;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('welcomeName').innerText = user;
            
            // Show history for all (or restrict if needed). Making visible for demo.
            document.getElementById('adminSection').style.display = 'block';

            if(user.toLowerCase() === 'admin') {
                document.getElementById('roleBadge').innerText = 'Admin';
                document.getElementById('roleBadge').className = 'badge badge-completed';
            }
            updateDashboard();
        } else {
            alert("Please enter a username.");
        }
    }

    function handleLogout() {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        billsData = []; // Clear local data on logout
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
    }

    function addProductRow(btn) {
        const wrapper = document.getElementById('productEntries');
        const row = document.createElement('div');
        row.className = 'product-entry-row';
        row.innerHTML = `
            <div class="autocomplete-wrapper">
                <input type="text" class="prod-name" placeholder="Search/Select Product..." autocomplete="off">
            </div>
            <input type="number" class="prod-qty" placeholder="Qty">
            <input type="number" class="prod-amount" placeholder="₹ Amt">
            <button class="btn-danger" style="font-size: 16px; width:42px; height:42px; padding:0;" onclick="this.parentElement.remove()">❌</button>
        `;
        wrapper.appendChild(row);
    }

    function addBillEntries() {
        const date = document.getElementById('date').value;
        const billNo = document.getElementById('billNo').value.trim();
        const customer = document.getElementById('customer').value.trim();
        
        if(!date || !billNo || !customer) {
            alert("Please fill Date, Bill No, and Customer Name.");
            return;
        }

        const rows = document.querySelectorAll('.product-entry-row');
        let products = [];
        let totalQty = 0;
        let totalAmt = 0;

        let validEntryFound = false;

        rows.forEach(row => {
            const pName = row.querySelector('.prod-name').value.trim();
            const pQty = parseFloat(row.querySelector('.prod-qty').value) || 0;
            const pAmt = parseFloat(row.querySelector('.prod-amount').value) || 0;

            if(pName || pQty > 0 || pAmt > 0) {
                products.push({ name: pName || 'Unknown Product', qty: pQty, amount: pAmt });
                totalQty += pQty;
                totalAmt += pAmt;
                validEntryFound = true;
            }
        });

        if(!validEntryFound) {
            alert("Please enter at least one product with quantity and amount.");
            return;
        }

        // Save to system state
        const newBill = {
            id: Date.now(),
            date: date,
            user: currentUser,
            billNo: billNo,
            customer: customer,
            products: products,
            totalQty: totalQty,
            totalAmt: totalAmt
        };

        billsData.push(newBill);
        
        // Reset form
        document.getElementById('billNo').value = '';
        document.getElementById('customer').value = '';
        document.getElementById('productEntries').innerHTML = `
            <div class="product-entry-row">
                <div class="autocomplete-wrapper">
                    <input type="text" class="prod-name" placeholder="Search/Select Product..." autocomplete="off">
                </div>
                <input type="number" class="prod-qty" placeholder="Qty">
                <input type="number" class="prod-amount" placeholder="₹ Amt">
                <button class="btn-action" style="font-size: 16px; width:42px; height:42px; padding:0;" onclick="addProductRow(this)">➕</button>
            </div>
        `;

        updateDashboard();
        alert('Bill logged successfully!');
    }

    function updateDashboard() {
        // Calculate Totals
        let totalAchieved = billsData.reduce((sum, bill) => sum + bill.totalAmt, 0);
        let gap = monthlyTarget - totalAchieved;
        let progressPct = Math.min(100, Math.round((totalAchieved / monthlyTarget) * 100));

        // Update UI Stats
        document.getElementById('totalVal').innerText = '₹' + totalAchie
